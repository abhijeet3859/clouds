name: Deploy Static Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USERNAME }}
      PASS: ${{ secrets.SERVER_PASSWORD }}
      PORT: "8003"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Setup Apache on Server
        run: |
          set -e

          # Create virtual host config
          cat <<EOF > /tmp/site.conf
<VirtualHost *:${PORT}>
    DocumentRoot /home/${USER}/website
    DirectoryIndex index.html

    <Directory /home/${USER}/website>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog \${APACHE_LOG_DIR}/website-error.log
    CustomLog \${APACHE_LOG_DIR}/website-access.log combined
</VirtualHost>
EOF

          # Upload config
          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no /tmp/site.conf "$USER@$HOST:/tmp/site.conf"

          # Configure server
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no "$USER@$HOST" "
            set -e

            echo '$PASS' | sudo -S apt-get update -qq
            echo '$PASS' | sudo -S apt-get install -y -qq apache2

            mkdir -p /home/$USER/website

            # Ensure Apache listens on port 8003
            if ! grep -q 'Listen $PORT' /etc/apache2/ports.conf; then
              echo '$PASS' | sudo -S bash -c 'echo Listen $PORT >> /etc/apache2/ports.conf'
            fi

            # Enable site
            echo '$PASS' | sudo -S mv /tmp/site.conf /etc/apache2/sites-available/site.conf
            echo '$PASS' | sudo -S a2dissite 000-default.conf || true
            echo '$PASS' | sudo -S a2ensite site.conf

            # Open firewall (ignore if ufw not active)
            echo '$PASS' | sudo -S ufw allow $PORT/tcp || true

            # Check config
            echo '$PASS' | sudo -S apache2ctl configtest

            # Restart Apache
            echo '$PASS' | sudo -S systemctl restart apache2
          "

      - name: Upload Website Files (ALL files)
        run: |
          sshpass -p "$PASS" scp -r -o StrictHostKeyChecking=no \
            ./* \
            "$USER@$HOST:/home/$USER/website/"

      - name: Verify Deployment
        run: |
          echo "Testing website..."
          sleep 5

          curl -v "http://$HOST:$PORT/"